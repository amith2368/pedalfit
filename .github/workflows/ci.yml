name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Server starts and serves the app
        run: |
          python3 server.py 8766 --no-open &
          sleep 2
          curl -fsS http://localhost:8766/ | grep -q pedalfit
          curl -fsS -o /dev/null http://localhost:8766/vendor/pose_landmarker_full.task
